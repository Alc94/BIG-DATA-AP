services:
  neo4j:
    image: afbueno/neo4j:5.22
    container_name: neo4j-fincen
    restart: unless-stopped
    ports:
      - "7474:7474"   # Interfaz web (Neo4j Browser)
      - "7687:7687"   # Protocolo Bolt (conexión drivers / Python / apps)
    environment:
      NEO4J_AUTH: "neo4j/SuperSeguro2025"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - ./import:/import

volumes:
  neo4j_data:
  neo4j_plugins: